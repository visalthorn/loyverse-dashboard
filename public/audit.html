<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Audit Log</title>
<script>
  (function() {
    var t = localStorage.getItem('pos_theme') === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.toggle('dark', t === 'dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; }
  .section-title { font-size: 0.9375rem; font-weight: 700; color: var(--text-primary); }
  .field-input {
    background: var(--bg-canvas); border: 1px solid var(--border); border-radius: 0.5rem;
    color: var(--text-primary); font-size: 0.8125rem; padding: 0.5rem 0.75rem;
    transition: border-color .15s; outline: none; width: 100%;
  }
  .field-input:focus { border-color: var(--accent-strong); }
  .field-input::placeholder { color: var(--text-dim); }
  .badge { display: inline-flex; align-items: center; padding: 0.1875rem 0.5rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600; }
  .audit-diff-row { background: var(--bg-canvas); }
  .audit-diff-row td { padding: 0 !important; }
  .audit-diff-table td { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
  .audit-diff-changed { background: color-mix(in srgb, var(--loss) 10%, transparent); }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
</style>
</head>
<body class="app-shell min-h-screen">

<!-- Sidebar -->
<aside id="sidebar" class="sidebar"></aside>

<!-- Mobile overlay -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Main content -->
<div class="main-wrapper">
  <header class="app-header px-4 md:px-6 py-3 flex items-center gap-3">
    <button onclick="toggleSidebar()" class="md:hidden px-2 py-1 rounded hover:bg-[color:var(--hover-tint)]" aria-label="Open menu"><span data-icon="menu" data-icon-size="22"></span></button>
    <div>
      <h2 class="text-lg font-semibold" data-i18n="audit.title">Audit Log</h2>
      <p class="text-xs text-[color:var(--text-secondary)]" data-i18n="audit.subtitle">Every write to expenses, staff, users and permissions, plus login attempts</p>
    </div>
    <div class="flex-1"></div>
    <button onclick="logout()" class="header-signout" data-i18n-title="common.signOut" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </header>

  <main class="p-4 md:p-6 space-y-4 w-full max-w-screen-xl mx-auto">

    <!-- Filters -->
    <div class="card">
      <form id="auditFilterForm" onsubmit="applyAuditFilters(event)" class="grid md:grid-cols-6 gap-3 items-end">
        <div>
          <label class="text-xs text-[color:var(--text-secondary)] mb-1 block" data-i18n="audit.fieldStart">From</label>
          <input id="auditStart" type="date" class="field-input"/>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)] mb-1 block" data-i18n="audit.fieldEnd">To</label>
          <input id="auditEnd" type="date" class="field-input"/>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)] mb-1 block" data-i18n="audit.fieldActor">Actor</label>
          <input id="auditActor" type="text" data-i18n-placeholder="audit.actorPlaceholder" placeholder="username" class="field-input"/>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)] mb-1 block" data-i18n="audit.fieldEntity">Entity</label>
          <select id="auditEntity" class="field-input">
            <option value="" data-i18n="audit.allEntities">All</option>
            <option value="expenses">expenses</option>
            <option value="staff">staff</option>
            <option value="users">users</option>
            <option value="role_permissions">role_permissions</option>
            <option value="receipts">receipts</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)] mb-1 block" data-i18n="audit.fieldAction">Action</label>
          <select id="auditAction" class="field-input">
            <option value="" data-i18n="audit.allActions">All</option>
            <option value="create">create</option>
            <option value="update">update</option>
            <option value="delete">delete</option>
            <option value="login">login</option>
            <option value="login_failed">login_failed</option>
            <option value="permission_change">permission_change</option>
            <option value="sync">sync</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button type="submit" class="btn-accent" data-i18n="audit.apply">Apply</button>
          <button type="button" onclick="resetAuditFilters()" class="text-xs text-[color:var(--text-secondary)] hover:text-[color:var(--accent-strong)] border border-[color:var(--border-strong)] px-3 py-2 rounded" data-i18n="common.reset">Reset</button>
          <button type="button" onclick="exportAuditCSV()" class="text-xs text-[color:var(--text-secondary)] hover:text-[color:var(--accent-strong)] border border-[color:var(--border-strong)] px-3 py-2 rounded flex items-center gap-1" title="Export CSV">
            <span data-icon="download" data-icon-size="14"></span> <span data-i18n="audit.exportCsv">Export CSV</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Log -->
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="section-title"><span data-icon="scroll"></span> <span data-i18n="audit.logTitle">Log</span></h2>
        <span id="auditTotal" class="text-xs text-[color:var(--text-secondary)]"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-[color:var(--text-secondary)] border-b border-[color:var(--border)] text-left text-xs">
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thWhen">When</th>
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thActor">Actor</th>
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thAction">Action</th>
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thEntity">Entity</th>
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thEntityId">Entity ID</th>
              <th class="pb-2 pr-3 font-medium" data-i18n="audit.thIp">IP</th>
              <th class="pb-2 font-medium text-center" data-i18n="audit.thDiff">Diff</th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <tr><td colspan="7" class="py-10 text-center text-[color:var(--text-secondary)]" data-i18n="audit.loadingRow">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="flex items-center justify-between mt-4">
        <span id="auditPageInfo" class="text-xs text-[color:var(--text-secondary)]"></span>
        <div class="flex items-center gap-2">
          <button class="page-btn" onclick="auditPrevPage()" id="auditPrevBtn">‹</button>
          <button class="page-btn" onclick="auditNextPage()" id="auditNextBtn">›</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('sidebar-open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }
  function toggleSidebarCollapse() {
    document.body.classList.toggle('sidebar-collapsed');
  }
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
