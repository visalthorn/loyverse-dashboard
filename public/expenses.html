<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>POS Expenses</title>
<script>
  (function() {
    var t = localStorage.getItem('pos_theme') === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.toggle('dark', t === 'dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  /* ---- Expenses/Recurring tabs (mirrors receipts.html's source tabs) ---- */
  .page-tab {
    padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 600;
    background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer;
  }
  .page-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .recurring-badge {
    display: inline-block; font-size: 0.6875rem; font-weight: 600; padding: 0.0625rem 0.375rem;
    border-radius: 0.25rem; background: var(--accent); color: var(--accent-contrast); margin-left: 0.375rem;
  }
</style>
</head>
<body class="app-shell min-h-screen">

<!-- Sidebar -->
<aside id="sidebar" class="sidebar"></aside>

<!-- Mobile overlay -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Main content -->
<div class="main-wrapper">

  <!-- Top bar -->
  <header class="app-header px-4 md:px-6 py-3 flex items-center gap-3">
    <button onclick="toggleSidebar()" class="md:hidden px-2 py-1 rounded hover:bg-[color:var(--hover-tint)]" aria-label="Open menu"><span data-icon="menu" data-icon-size="22"></span></button>
    <div>
      <h2 class="text-lg font-semibold" data-i18n="expenses.title">Expenses</h2>
      <p class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.subtitle">Manage expense entries</p>
    </div>
    <div class="flex-1"></div>
    <button onclick="logout()" class="header-signout" data-i18n-title="common.signOut" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </header>

  <main class="p-4 md:p-6 max-w-screen-xl mx-auto space-y-6 w-full">
    <div class="flex gap-2">
      <button id="expensesTabList"      onclick="switchExpensesTab('list')"      class="page-tab active" data-i18n="expenses.tabList">Expenses</button>
      <button id="expensesTabRecurring" onclick="switchExpensesTab('recurring')" class="page-tab" data-i18n="expenses.tabRecurring">Recurring</button>
    </div>

    <section id="expensesListSection" class="card">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="section-title"><span data-icon="banknote"></span> <span>Expenses</span></h2>
          <p class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.listSubtitle">Add, edit, and review expense records</p>
        </div>
      </div>

      <form id="expenseForm" data-write-page="expenses" class="grid md:grid-cols-3 gap-3 mb-4" onsubmit="submitExpense(event)">
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.date">Date</label>
          <input id="expenseDate" type="date" required class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.amount">Amount</label>
          <input id="expenseAmount" type="number" step="0.01" required class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.expenseBy">Expense by</label>
          <input id="expenseBy" type="text" required placeholder="Name" data-i18n-placeholder="expenses.expenseByPlaceholder" class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.branch">Branch</label>
          <select id="expenseBranch" class="w-full field-select"></select>
        </div>
        <div class="md:col-span-3">
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.remark">Remark</label>
          <textarea id="expenseRemark" placeholder="Optional note" data-i18n-placeholder="expenses.remarkPlaceholder" class="w-full field-input"></textarea>
        </div>
        <div class="md:col-span-3 flex items-center gap-2">
          <button type="submit" class="btn-accent" data-i18n="expenses.addButton">Add Expense</button>
          <div id="expenseMsg" class="text-sm text-[color:var(--text-secondary)]"></div>
        </div>
      </form>

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-3">
        <div class="flex flex-wrap items-center gap-3">
          <h2 class="section-title"><span data-icon="banknote"></span> <span data-i18n="expenses.listTitle">Expenses List</span></h2>
          <span id="expensesSummary" class="text-sm text-[color:var(--text-secondary)]"><span class="text-sm text-[color:var(--accent-strong)] font-bold">0</span> items · Total: <span class="text-sm text-[color:var(--accent-strong)] font-bold">៛0.00</span></span>
        </div>
        <div class="flex flex-wrap items-center gap-2 text-xs text-[color:var(--text-secondary)]">
          <select id="expenseBranchFilter" class="field-select" style="font-size:.75rem;padding:6px 26px 6px 9px"></select>
          <div id="dateFilterMount"></div>
          <button onclick="exportExpensesCSV()" class="btn-ghost"><span><span data-icon="download"></span> <span data-i18n="common.csv">CSV</span></span></button>
        </div>
      </div>
      <div id="expensesList" class="space-y-2 text-sm text-[color:var(--text-secondary)]"></div>
    </section>

    <section id="recurringSection" class="card" style="display:none">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="section-title"><span data-icon="banknote"></span> <span data-i18n="expenses.recurringTitle">Recurring Expenses</span></h2>
          <p class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringSubtitle">Templates for bills that repeat monthly or weekly</p>
        </div>
      </div>

      <form id="recurringForm" data-write-page="expenses" class="grid md:grid-cols-3 gap-3 mb-4" onsubmit="submitRecurringTemplate(event)">
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringName">Name</label>
          <input id="recurringName" type="text" required placeholder="e.g. Rent" class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.amount">Amount</label>
          <input id="recurringAmount" type="number" step="0.01" required class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringCategory">Category</label>
          <input id="recurringCategory" type="text" placeholder="Optional" class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringFrequency">Frequency</label>
          <select id="recurringFrequency" class="w-full field-select" onchange="onRecurringFrequencyChange()">
            <option value="monthly" data-i18n="expenses.recurringMonthly">Monthly</option>
            <option value="weekly" data-i18n="expenses.recurringWeekly">Weekly</option>
          </select>
        </div>
        <div id="recurringDayOfMonthField">
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringDayOfMonth">Day of month</label>
          <input id="recurringDayOfMonth" type="number" min="1" max="31" value="1" class="w-full field-input" />
        </div>
        <div id="recurringDayOfWeekField" style="display:none">
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringDayOfWeek">Day of week</label>
          <select id="recurringDayOfWeek" class="w-full field-select">
            <option value="1" data-i18n="common.monday">Monday</option>
            <option value="2" data-i18n="common.tuesday">Tuesday</option>
            <option value="3" data-i18n="common.wednesday">Wednesday</option>
            <option value="4" data-i18n="common.thursday">Thursday</option>
            <option value="5" data-i18n="common.friday">Friday</option>
            <option value="6" data-i18n="common.saturday">Saturday</option>
            <option value="0" data-i18n="common.sunday">Sunday</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.branch">Branch</label>
          <select id="recurringBranch" class="w-full field-select"></select>
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringStartDate">Start date</label>
          <input id="recurringStartDate" type="date" required class="w-full field-input" />
        </div>
        <div>
          <label class="text-xs text-[color:var(--text-secondary)]" data-i18n="expenses.recurringEndDate">End date (optional)</label>
          <input id="recurringEndDate" type="date" class="w-full field-input" />
        </div>
        <div class="md:col-span-3 flex items-center gap-2">
          <button type="submit" class="btn-accent" data-i18n="expenses.recurringAddButton">Add Template</button>
          <div id="recurringMsg" class="text-sm text-[color:var(--text-secondary)]"></div>
        </div>
      </form>

      <div id="recurringList" class="space-y-2 text-sm text-[color:var(--text-secondary)]"></div>
    </section>
  </main>
</div>

<script>
  /* ===========================
     Sidebar helpers
  =========================== */
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('sidebar-open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }
  function toggleSidebarCollapse() {
    document.body.classList.toggle('sidebar-collapsed');
  }
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
